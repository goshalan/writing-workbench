[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-workbench"
version = "0.1.0"
description = "A privacy-conscious local workbench for writing books in Markdown and plain text."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Alan" }]
keywords = ["writing", "markdown", "flask", "editor", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Editors :: Text Processing",
]
dependencies = [
  "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
writing-workbench = "writing_workbench.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["writing_workbench*"]

[tool.setuptools.package-data]
writing_workbench = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.exclude-package-data]
"*" = ["._*", "**/._*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "._*", "**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
